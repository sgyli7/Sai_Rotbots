<g font-family="sans-serif" fill="#263747"><text x="35" y="320" font-size="20">Power and command: supply / inverter → stator; motor rotor → real input coupling → reducer → output carrier.</text><text x="35" y="356" font-size="20">Reaction: external carrier wrench → OEM output bearing → OEM fixed case → finite load shell → parent bridge.</text><text x="35" y="572" font-size="20">Feedback, brake, coolant, lubrication and service paths are retained functions; packaging owner ≠ rotor/output inertia owner.</text><text x="35" y="612" font-size="20" fill="#ab2525">Route 2 can share housing material; replacing OEM integrated support needs a new complete transmission/support design.</text><text x="35" y="652" font-size="20" fill="#ab2525">The common-shell native probe has a reserved support window only. No invented race, bearing mass saving or capacity.</text><text x="35" y="703" font-size="18">SIM: bounded geometric and stiffness/load hypotheses may proceed. REAL HARDWARE: mounting, preload, life and heat remain unverified.</text></g>
</svg>
