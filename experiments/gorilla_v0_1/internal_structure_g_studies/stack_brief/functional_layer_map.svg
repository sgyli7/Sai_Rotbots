<rect x="35" y="160" width="190" height="105"/><rect x="280" y="160" width="200" height="105"/><rect x="535" y="160" width="260" height="105"/><rect x="850" y="160" width="235" height="105"/><rect x="1140" y="160" width="300" height="105"/>
