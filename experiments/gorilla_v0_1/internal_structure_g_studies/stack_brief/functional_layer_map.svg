<g font-family="sans-serif" fill="#263747"><text x="35" y="42" font-size="27">GORILLA G | FUNCTIONAL LAYER MAP — NOT OEM INTERNAL CAD</text><text x="35" y="77" font-size="18">Catalog gear already contains output support. A/B face identity and internal moving mass remain unknown.</text></g>
