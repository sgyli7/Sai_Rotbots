name: Simulation package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --locked --extra test
      - run: uv run pytest -q
      - run: uv run python scripts/evaluate_flat.py --policy policies/flat-v1.onnx --out artifacts/ci-flat --full-robot --require-pass
      - run: uv run python scripts/evaluate_stairs.py --policy policies/stairs-dev40.onnx --out artifacts/ci-stairs --risers .02 .04 --full-robot --require-pass
      - run: uv run python scripts/evaluate_cargo.py --out artifacts/ci-cargo --require-pass
      - run: uv run python scripts/evaluate_cargo.py --out artifacts/ci-no-clamp --no-clamp --require-pass
      - run: uv build --wheel --out-dir artifacts/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-evidence-and-wheel
          path: |
            artifacts/ci-*/result.json
            artifacts/dist/*.whl
