name: Simulation package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --locked --extra test
      - run: uv run pytest -q
      - run: uv run python scripts/evaluation/evaluate_flat.py --policy shared/policies/flat-v1.onnx --out artifacts/Sai_Agent_001/ci_flat --full-robot --require-pass
      - run: uv run python scripts/evaluation/evaluate_stairs.py --policy shared/policies/stairs-dev40.onnx --out artifacts/Sai_Agent_001/ci_stairs --risers .02 .04 --full-robot --require-pass
      - run: uv run python scripts/evaluation/evaluate_stairs.py --policy shared/policies/experimental/ascent60.onnx --out artifacts/Sai_Agent_001/ci_ascent60 --risers .06 --direction up --speed .08 --lift-height .07 --leg-scale .45 --heading-control --max-seconds 45 --full-robot --require-pass
      - run: uv run python scripts/evaluation/evaluate_stairs.py --policy shared/policies/experimental/descent60.onnx --out artifacts/Sai_Agent_001/ci_descent60 --risers .02 .04 .06 --direction down --speed .08 --crouch .5 --heading-control --lane-control --yaw-correction-limit .6 --max-seconds 45 --full-robot --require-pass
      - run: uv run python scripts/evaluation/evaluate_cargo.py --out artifacts/Sai_Agent_001/ci_cargo --require-pass
      - run: uv run python scripts/evaluation/evaluate_cargo.py --out artifacts/Sai_Agent_001/ci_no_clamp --no-clamp --require-pass
      - run: uv run python scripts/evaluation/evaluate_flat.py --robot Sai_Agent_002 --policy shared/policies/flat-v1.onnx --out artifacts/Sai_Agent_002/ci_flat --full-robot --require-pass
      - run: uv run python scripts/evaluation/evaluate_stairs.py --robot Sai_Agent_002 --policy shared/policies/stairs-dev40.onnx --out artifacts/Sai_Agent_002/ci_stairs --risers .02 .04 --full-robot --require-pass
      - run: uv run python scripts/evaluation/evaluate_cargo.py --robot Sai_Agent_002 --out artifacts/Sai_Agent_002/ci_cargo --require-pass
      - run: uv build --wheel --out-dir artifacts/dist
      - name: Verify freshly installed distribution
        run: |
          uv venv --python 3.12 artifacts/project/package_check/venv
          uv pip install --python artifacts/project/package_check/venv/bin/python artifacts/dist/*.whl
          artifacts/project/package_check/venv/bin/python scripts/diagnostics/check_distribution.py --wheel artifacts/dist/*.whl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-evidence-and-wheel
          path: |
            artifacts/Sai_Agent_*/ci_*/result.json
            artifacts/dist/*.whl
