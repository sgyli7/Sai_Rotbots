name: Gorilla CEM V3 numerical dependencies
on:
  push:
    branches: [codex/gorilla-tibia-cem-v1]
    paths: [.github/workflows/gorilla-cem-v3-numerics.yml]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download numerical and remeshing wheels
        run: |
          mkdir -p payload
          python -m pip download --no-deps --only-binary=:all: -d payload scikit-fem pyvista-validation manifold3d pyacvd pymeshfix || exit 1
          python - <<'PY'
          import pathlib,json,hashlib
          p=pathlib.Path('payload')
          (p/'MANIFEST.json').write_text(json.dumps([{'file':x.name,'sha256':hashlib.sha256(x.read_bytes()).hexdigest()} for x in p.glob('*.whl')],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gorilla-v3-numerical-deps
          path: payload
          retention-days: 7
